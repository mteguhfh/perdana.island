name: Feature request
description: Suggest a change for the GNOME extension or KDE widget
title: "[Feature]: "
body:
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop
      options:
        - GNOME Shell
        - KDE Plasma
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
      placeholder: I cannot ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want, including any controls or data it needs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or links to similar features.
    validations:
      required: false
