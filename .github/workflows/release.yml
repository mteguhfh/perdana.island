name: Publish desktop packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes zip libglib2.0-bin

      - name: Build GNOME and KDE packages
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -f "docs/releases/${RELEASE_TAG}.md" ]]; then
            gh release create "$RELEASE_TAG" \
              "dist/Perdana-Island-GNOME-${RELEASE_TAG}.shell-extension.zip" \
              "dist/Perdana-Island-KDE-Plasma-${RELEASE_TAG}.zip" \
              --title "Perdana Island ${RELEASE_TAG}" \
              --notes-file "docs/releases/${RELEASE_TAG}.md"
          else
            gh release create "$RELEASE_TAG" \
              "dist/Perdana-Island-GNOME-${RELEASE_TAG}.shell-extension.zip" \
              "dist/Perdana-Island-KDE-Plasma-${RELEASE_TAG}.zip" \
              --title "Perdana Island ${RELEASE_TAG}" \
              --generate-notes
          fi
